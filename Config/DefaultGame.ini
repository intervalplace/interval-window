; ---- WHAT THE ASSET MANAGER SHOULD SCAN FOR ----
;
; A cook of this project finished its work and then failed, because two of the
; lines in its log were errors: "Asset manager settings do not include a rule
; for assets of type GameFeatureData". Nothing here uses game features -- they
; arrive with a plugin something else enables -- but the cook counts errors,
; not consequences, so a complaint about a system this project does not use
; was enough to stop a standalone client being built at all.
;
; Naming the type settles it. It is editor-only and cooked by nobody, which is
; exactly what it was already doing silently.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass=/Script/GameFeatures.GameFeatureData,bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

; ---- WHAT MUST BE COOKED EVEN THOUGH NOTHING POINTS AT IT ----
;
; This window loads most of its art BY NAME at runtime. `IconFor` asks for
; /Game/Interval/Icons/<item>, the wardrobe is a data asset fetched by path,
; the level-up cue and every ambience are looked up the same way, and the
; cursors are chosen from a table of words. None of that is a reference the
; cook can follow: a cook walks from the maps outwards through hard pointers,
; and a string is not a pointer.
;
; So the first packaged client ran, and was missing exactly the things nothing
; points at. The pack drew letters where the item sprites should be, the
; citizen wore nothing, the cursor was a white square, the props were absent
; and there was no music. Every one of those is the same fault seen from a
; different angle.
;
; Naming the directories is the whole fix. It is also the honest description
; of the situation: these are assets the project promises to have at runtime,
; and a promise the cook cannot verify has to be declared.
[/Script/UnrealEd.ProjectPackagingSettings]
; NOT THE TEMPLATE'S OWN FOLDERS. Adding /Game/Characters and /Game/TopDown
; crashed the cook outright in `ResolveReferencesToPin`: a Blueprint from the
; third-person template this project was started from has a broken graph that
; nothing has ever loaded, because nothing has ever referenced it. Cooking a
; directory loads everything in it, including what was quietly never used.
;
; /Game/Interval holds no Blueprint at all -- it is meshes, textures, sounds
; and one data asset -- so the whole of it is safe, and the whole of it is
; wanted: the wardrobe sits in its root and hard-references every mesh a
; citizen wears, so cooking it brings the clothes, the props and the tools
; along behind it. Narrowed to Icons and Audio, the pack had sprites and the
; citizen was still a mannequin standing beside a cylinder that should have
; been a fountain.
; THE WARDROBE IS REACHED BY A REAL REFERENCE NOW (see the tail of apply.py),
; so the meshes, materials and textures a citizen wears follow it without the
; whole art tree being forced. Forcing it crashed the cook anyway: something
; under /Game/Interval has a broken material graph, and cooking a directory
; loads every asset in it whether anything uses it or not.
;
; What remains here is what genuinely has no reference at all: sprites asked
; for by item name, sounds asked for by word, and the cursors.
+DirectoriesToAlwaysCook=(Path="/Game/Interval/Icons")
+DirectoriesToAlwaysCook=(Path="/Game/Interval/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Cursor")

; ---- AND THE WORLD'S OWN RULES, WHICH ARE NOT ASSETS ----
;
; `Content/Bridge` holds `engine.js` and the dozen modules around it. They are
; STAGED AS LOOSE FILES and never cooked, and that distinction is the whole
; point: the engine's source is evaluated as text, byte for byte as it is on
; disk, because the SHA of those bytes is what a founding records about which
; rules made it. Anything that rewrote them -- a cook, a bundler, a line
; ending -- would be a different world and would say so in that one number.
;
; This is what makes a phone possible. There can be no Node process beside an
; app on iOS, so the bridge runs INSIDE it, in JavaScriptCore, on the files
; below. `Tools/stage_bridge.sh` puts them there and checks them.
; THE PATH IS ALREADY RELATIVE TO Content/, which the first version of this
; line got wrong -- it said "Content/Bridge" and the cook went looking for
; Content/Content/Bridge. It SAID so, once, in a log of forty thousand lines:
;
;   Unable to find directory ".../Content/Content/Bridge" for staging,
;   retrieved from "ProjectPackagingSettings" "DirectoriesToAlwaysStageAsNonUFS"
;
; and then exited zero, because a staging directory that is not there is not a
; cook failure. What came out was a client with no rules inside it, which only
; matters the day the bridge has to run in-process -- so on a desktop nothing
; would have gone wrong until iOS, where nothing else can go right.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Bridge")
