; ---- THE BRIDGE SOCKET MUST NOT HOLD THE FRAME ----
;
; Measured, with `stat dumpframe`: 68.6 milliseconds of every frame were spent
; inside FLwsWebSocketsManager::GameThreadTick -- the one socket this window
; has, to the bridge. libwebsockets is serviced with a timeout taken from
; ThreadTargetFrameTimeInSeconds, and the engine default of 33.3 ms is a
; sensible figure for a service thread and a disaster on the game thread,
; where it is simply a block. Two of them a frame is a quarter of a second.
;
; ---- AND THEN PUT BACK, BECAUSE THE MEASUREMENT WAS WORTHLESS ----
;
; The 68 ms was read off `stat dumpframe` while the editor was THROTTLED to
; three frames a second -- the same doze that made every other reading that
; afternoon meaningless. A socket serviced once per 343 ms frame will of course
; report a long service; it was measuring the doze, not the socket.
;
; Cutting it to one millisecond was therefore a change made on no evidence, and
; there is a symptom that fits it: after a long session Unreal's frame stops
; advancing while the bridge goes on ticking, so the window freezes with the
; walk animation still running -- a citizen marching in place. A service window
; too short to drain the queue would do exactly that.
;
; Back to the engine's own figure. If the socket ever does prove to cost real
; time, it must be measured on an editor that is awake.
[WebSockets.LibWebSockets]
ThreadTargetFrameTimeInSeconds=0.0333

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; ---- THE PHONE ----
;
; Nothing in this project is Mac-shaped except its build scripts: the plugin
; has no `#if PLATFORM_*` anywhere, the .uplugin has no allow-list, and every
; module it depends on ships on iOS. What was missing was an account to sign
; with, and that is what these lines are.
;
; SIGNED AUTOMATICALLY, against an individual enrolment. Xcode makes and renews
; the provisioning profile; the alternative is a .mobileprovision checked into
; a repository, which is a certificate in a public place.
;
; AND THESE THREE LINES ARE NOT THE ONES THAT DO IT ANY MORE. They were where
; the team id lived before 5.3, and they are kept because the engine still
; reads them on the old path, but under `bUseModernXcode` -- which is the
; default now and is what this project builds with -- signing is read from
; `XcodeProjectSettings` instead. See the block at the foot of this file.
;
; That is worth stating plainly because of how it fails: the team id sits
; here looking right, the generated Xcode project gets no DEVELOPMENT_TEAM at
; all, and the build dies on "Signing for interval requires a development
; team. Select a development team in the Signing & Capabilities editor" --
; which points at a window in Xcode rather than at the setting that was
; ignored.
bAutomaticSigning=True
IOSTeamID=8N2V33SC8V
BundleIdentifier=place.interval.window

; LANDSCAPE ONLY, and for a reason that is not taste: the window is a top-down
; view with a chat line across the bottom and a pack down the side, and the
; pack alone is a fifth of the width. In portrait there is no room for the
; world between them.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft

; METAL, and a floor of iOS 17. The engine's own floor for 5.8 is higher than
; anything this would run well on anyway: the island is thousands of
; non-Nanite meshes streaming past a moving camera, and the phones that manage
; that are the recent ones.
bSupportsMetal=True
MinimumiOSVersion=IOS_17

; NO STOREKIT AND NO GAME CENTER. There is nothing to sell and no leaderboard
; that is not the world's own ledger.
bEnableStoreKitSupport=False
bEnableGameCenterSupport=False

; THE FILES A CITIZEN OWNS. The key is written on the device and is the
; citizen; file sharing is what lets somebody back it up or carry it to
; another phone, which is the only way there is -- there is nobody to ask for
; it back.
bSupportsITunesFileSharing=True

[/Script/MacTargetPlatform.XcodeProjectSettings]
; ---- WHO SIGNS THIS, UNDER MODERN XCODE ----
;
; From 5.3 the engine generates its Xcode projects a different way, and from
; 5.5 that way is the default. Under it the signing team and the bundle id are
; read from HERE and not from IOSRuntimeSettings, and a team named only in the
; old place is silently not used: the generated project comes out with no
; DEVELOPMENT_TEAM, `UE_SIGNING_PREFIX` stays at Epic's `com.YourCompany`
; placeholder, and the app cannot be signed.
;
; ONE IDENTIFIER FOR BOTH. `place.interval.window` is the Mac app's too. They
; are the same window onto the same world and there is no reason for them to
; be two applications; a citizen who plays on both is the same citizen, and
; the key that says so lives in neither.
bUseAutomaticCodeSigning=true
CodeSigningTeam=8N2V33SC8V
CodeSigningPrefix=place.interval
BundleIdentifier=place.interval.window
