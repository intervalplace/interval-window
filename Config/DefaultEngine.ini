r.DynamicGlobalIlluminationMethod=1
r.Shadow.Virtual.Enable=1
; WHY THE SHADOW PAGE POOL IS FOUR TIMES THE DEFAULT.
;
; This island is drawn as NON-NANITE geometry: every chunk is a procedural
; mesh and every wall, roof, tree and barrel is an instanced static mesh. A
; settlement is therefore thousands of shadow-casting instances in one view,
; and at the defaults the virtual shadow map ran out of marking jobs and page
; area partway through the frame.
;
; What that looks like is not a missing shadow. The instances the pass never
; reached come out FULLY SHADOWED, so whole buildings -- the far half of a
; town, roofs and walls together -- render as flat black slabs standing in a
; sunlit street. It was reported as "why is the ground red", because at dusk
; the same failure is maroon rather than black, and it was found by turning
; shadows off for one frame and watching every slab turn back into a roof.
;
; The screen message it prints names the cvar that SILENCES it, not the one
; that fixes it, which is most of why this took so long to place.
r.Shadow.Virtual.NonNanite.MaxInstanceMarkingJobs=16384
r.Shadow.Virtual.NonNanite.MaxPageAreaPerInstance=512
r.Shadow.Virtual.MaxPhysicalPages=16384
; AND THE MESSAGE ITSELF IS OFF, which is not the same as ignoring it.
;
; The overflow warning prints in red across the top of the screen in any build
; that is not Shipping, and the downloadable client is Development -- so a
; player's first sight of this world was a renderer diagnostic. It is off now
; that the pools above are four times the default and the thing it was warning
; about is fixed.
;
; WHAT IT LOOKED LIKE, written down because the warning is no longer there to
; say it: whole buildings render as FLAT BLACK SLABS in a sunlit street, and
; at dusk the same slabs are maroon. The test that settles it in one frame is
; `r.Shadow.Virtual.Enable 0` -- if the slabs turn back into roofs, the shadow
; map has run out of pages again and these numbers want raising.
r.Shadow.Virtual.AllowScreenOverflowMessages=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False

r.SkinCache.CompileShaders=True

r.RayTracing=True

r.RayTracing.RayTracingProxies.ProjectEnabled=True

; ---- WHY THE GROUND WAS GRAVEL ----
;
; Lumen's short-range ambient occlusion traced in SCREEN space by default, and
; on a world whose ground is rebuilt as chunks stream past, its temporal
; history is rejected constantly. What is left is raw trace noise, and on a
; large flat matte surface under an overcast sky that is the whole of the
; shading -- every road, courtyard and meadow in the window came out as dark
; worms of wet gravel at every range, in every weather, and it was mistaken
; several times over for a fault in the ground material.
;
; TURNED OFF ALTOGETHER, AFTER MEASURING IT.
;
; The first fix was to point the short-range AO at the hardware rays this
; project already uses, which is clean and keeps the contact darkening under a
; signpost. It also costs 11.6 milliseconds of a 38.8 millisecond frame --
; thirty per cent, and more than Lumen's global illumination and the
; volumetric fog put together:
;
;   everything on ................ 38.8 ms
;   no Lumen GI .................. 36.5 ms   (-2.3)
;   no volumetric fog ............ 35.3 ms   (-3.5)
;   short-range AO ray traced off  27.2 ms  (-11.6)
;   short-range AO off entirely .. 26.8 ms  (-12.0)
;
; Off entirely is as clean as ray-traced -- the noise was the SCREEN traces,
; and either answer removes them -- and a third of the frame is not what a
; little extra darkness in a corner is worth. The contact occlusion can come
; back by a cheaper road if it is ever missed.
r.Lumen.ScreenProbeGather.ShortRangeAO=0

; ---- AND THEN LUMEN'S GLOBAL ILLUMINATION WENT WITH IT ----
;
; The measurement above says Lumen GI cost 2.3 ms. That was true of the island
; as it stood then. It is not true now, and the difference is not small: the
; window was reported as barely playable -- "walking is extremely buggy... it
; really struggles" -- and it was running at TWELVE frames a second with the
; dynamic resolution already scaled down to 48 per cent trying to keep up.
;
; `stat gpu`, in the world, walking:
;
;   Queue Total ............. 70.5 ms
;     RenderDeferredLighting  26.8      (mostly Lumen's integration)
;     LumenScreenProbeGather  25.5
;     LumenSceneUpdate        16.1      and 64.0 at its worst
;     LumenSceneLighting       7.7
;     Shadow Depths            2.5      <- the pools raised above are NOT it
;
; Forty-nine milliseconds in Lumen's own three passes. `LumenSceneUpdate`
; spiking to sixty-four is the surface cache re-capturing: this island is
; thousands of non-Nanite meshes streaming past a moving camera, which is the
; case Lumen's cache is worst at, and it is the same thing the "surface cache
; oversubscribed" warning has been saying all along.
;
; WITH IT OFF, MEASURED THE SAME WAY:
;
;   Queue Total ............. 33.1 ms   (-37.4)
;   frame, median ........... 45.5 ms   from 77.9
;   frames a second ......... 22        from 12.8
;
; AND THE PICTURE. Photographed at the same hour, from the same spot, with and
; without: the difference is a little contact shading under the trees and the
; eaves, and the no-Lumen frame is a shade brighter and flatter. On a top-down
; view of matte stylised ground that is not worth half the frame rate. The
; sky light still lights the world; see `SkyLift` in apply.py.
;
; ONE LINE TO PUT BACK, and the numbers above are what to weigh it against.
r.Lumen.DiffuseIndirect.Allow=0

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

