[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/TopDownBP
; The MCP server is how this window gets built: the ground, the material and
; the light are all placed through it. Starting it by hand from the console
; every launch is a step that gets forgotten, and a missing tool looks exactly
; like a stopped editor from the outside.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp

; ---- THE EDITOR MUST NOT DOZE WHEN NOBODY IS LOOKING AT IT ----
;
; Unreal throttles the editor to a few frames a second whenever its window is
; not the foreground one. That is right for a person with the editor behind a
; browser, and it is quietly fatal here: every measurement and every photograph
; this project takes is taken over MCP with the editor in the background, so a
; frame-time reading came back at 343 ms flat and did not move when Lumen,
; volumetric fog and hardware ray tracing were each turned off in turn. It was
; not measuring the window at all. It was measuring the doze.
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
